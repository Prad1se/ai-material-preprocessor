[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-material-preprocessor"
version = "1.4.0"
description = "Local AI document and creative media preprocessing tool for Windows"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8,<7",
  "markitdown[docx,pptx,xlsx,xls,pdf]>=0.1.6,<0.2",
  "imageio-ffmpeg>=0.6,<0.7",
  "rapidocr>=3.9,<4",
  "onnxruntime>=1.20,<2",
  "pypdfium2>=5.10,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "pytest-qt>=4.5,<5",
  "ruff>=0.16,<0.17",
  "mypy>=2.3,<3",
]
build = [
  "pyinstaller>=6.20,<7",
  "static-ffmpeg>=3,<4",
]

[project.scripts]
ai-material-preprocessor = "ai_material_preprocessor.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist", "release", "work"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
exclude = "^(build|dist|release|work)/"
