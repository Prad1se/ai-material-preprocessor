name: Feature request
description: Suggest an in-scope local document or media workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Desired local workflow
      description: Explain inputs, outputs, and why existing tools are insufficient.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not require uploading user files by default.
          required: true
