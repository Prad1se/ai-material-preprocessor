name: Bug report
description: Report a reproducible defect without attaching private source material.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      options: [Installer, Portable ZIP, Source checkout]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted files only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private document content, credentials, paths, and GPS data.
          required: true
