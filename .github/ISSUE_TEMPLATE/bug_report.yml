name: 缺陷报告 / Bug report
description: 报告可复现问题，请勿附带私人素材。Report a reproducible defect without private source material.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: 版本 / Version
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: 使用方式 / Package
      options: [安装版 / Installer, 便携版 / Portable ZIP, 源码 / Source checkout]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Reproduction steps
      description: 请只使用合成或脱敏文件。Use synthetic or redacted files only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果 / Expected and actual result
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认 / Privacy check
      options:
        - label: 我已移除私人文档内容、凭据、本机路径与 GPS 信息。I removed private content, credentials, paths, and GPS data.
          required: true
